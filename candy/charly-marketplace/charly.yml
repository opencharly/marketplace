charly-marketplace:
    candy:
        description: |-
            The marketplace corpus SOURCE — the candy-dir charly.yml that makes
            `charly marketplace generate --root <this repo>` work post-cutover. It
            references pod-charly-hooks (the single `marketplace:` entity + the harness
            gate hooks) and every standalone candy repo that owns `skill:` / `hook:`
            entities, so readKinds' CollectEntitiesRemote resolves the full corpus
            transitively. The family dirs at this repo's root are the GENERATED corpus,
            not the source — regeneration is a no-op on a clean tree (the drift gate).
        candy:
            # The `@github.com/opencharly/charly` ref below is a CORPUS SOURCE, not a candy
            # node (opencharly/sdk#468): the repo-root form names the REPO, and charly authors
            # the skills that describe its own Go module and plugin kernel at `.agents/skills/`
            # beside that code. The note that used to sit here — "charly's OWN candies are NOT
            # referenced here … resolved to unknown candy" — described the pre-cutover SUBPATH
            # form's refusal and an older candy-resolution failure. Both are answered: the
            # subpath form stays refused by design, and the repo-root ref is now admitted.
            - '@github.com/opencharly/pod-charly-hooks:v2026.297.0523'
            - '@github.com/opencharly/eval-omarchy:v2026.295.0943'
            # The distro-* image families own their OS/base skills (relocated from the
            # layer-charly-distros concept aggregator — this pin is the corpus source for
            # them). distro-arch is the first pinned; the rest follow in the same wave.
            - '@github.com/opencharly/distro-arch:v2026.296.1011'
            # The remaining distro-* image families own their OS/base skills too
            # (same wave as distro-arch).
            - '@github.com/opencharly/distro-fedora:v2026.294.2023'
            - '@github.com/opencharly/distro-cachyos:v2026.296.1011'
            - '@github.com/opencharly/distro-omarchy:v2026.294.1828'
            - '@github.com/opencharly/distro-debian:v2026.296.1011'
            - '@github.com/opencharly/distro-ubuntu:v2026.296.1519'
            # charly ITSELF is a DIRECT corpus source (issue opencharly/sdk#468, landed by
            # opencharly/sdk#470). It publishes the four skills that describe its own code:
            # `go`, `go-quality`, `plugin` (family internals) and `charly-version` (family core).
            # Two twins exist and both lose: `layer-charly-internals:v2026.296.1907` still serves
            # the internals trio from a tag that predates that carrier's own retirement, and
            # `pod-charly-core` reaches the corpus at OLD tags through the `distro-fedora` /
            # `distro-cachyos` closures (opencharly/distro-fedora#107). This ref is DIRECT where
            # the twins are not, and among DIRECT refs the NEWER tag wins (`resolve.go`
            # preferEntity steps 2 and 3) — so this pin is the authority while it is the newer
            # one. All FOUR bodies are byte-identical at both sources, so this moves the
            # AUTHORITY, not the bytes: the only published change is TWO DISPATCHER rows (`go`
            # and `plugin`), which carry this pin's corrected `spec/schema/*.cue` trigger instead
            # of the carrier's stale `sdk/schema/*.cue` (`go-quality`'s trigger is identical at
            # both sources, so its row does not move).
            - '@github.com/opencharly/charly:v2026.297.0032'
            # Standalone sources for internals, command and authoring skills.
            - '@github.com/opencharly/layer-charly-internals:v2026.297.0301'
            # The internals skills the DRAIN moved to their owning repos
            # (opencharly/layer-charly-internals#142): `egress` -> plugin-egress,
            # `marketplace` -> plugin-marketplace, `vm-deploy-target` -> plugin-deploy-vm.
            # The carrier's tag no longer holds them, so without these three DIRECT refs
            # the corpus resolves each of them to a TRANSITIVE twin at an old tag and
            # publishes a pre-move copy — measured: the projections of all three CHANGE
            # against the committed corpus, and two of them lose net lines (egress +2/-16,
            # marketplace +7/-19) (opencharly/marketplace#537). DIRECT, so
            # they win over the transitive twins (resolve.go preferEntity step 2), and each
            # body's sha256 equals the copy the carrier held at the drain, so pinning the
            # owners moves the AUTHORITY, not the bytes.
            - '@github.com/opencharly/plugin-egress:v2026.296.1538'
            - '@github.com/opencharly/plugin-marketplace:v2026.296.2345'
            - '@github.com/opencharly/plugin-deploy-vm:v2026.296.1557'
            # The UMBRELLA's OWN general-guidance skills (opencharly/opencharly#600,
            # AGENTS.md Part II #5): `agents`, `cutover-policy`, `root-cause-analyzer` have
            # no code, plugin or config behind them, so their home is the one repo every
            # consumer shares. DIRECT, deliberately: `plugin-marketplace#41` showed a skill
            # reached only through the closure publishes whatever tag a sibling names.
            #
            # This pin was WITHDRAWN from #566 because a repo with submodules could not be a
            # corpus source at all: `spec/refs.DownloadRepo` initialised every declared
            # gitlink (this repo declares 412) and failed the whole fetch when one could not
            # be reached (opencharly/spec#279, opencharly/spec#267). The files-only corpus
            # fetch (`refs.DownloadRepoFiles`) is what makes this line possible: the walk
            # reads charly.yml and the .agents/ trees and certifies exactly that.
            #
            # The carrier above still publishes its twin of those three; both are direct, so
            # the newer tag wins (`resolve.go` preferEntity step 3) — the umbrella's, as long
            # as this pin is the newer one. Draining the carrier's three is its own PR.
            - '@github.com/opencharly/opencharly:v2026.296.2254'
            # The two CONTRACT repos' skill shelves (opencharly/opencharly#611).
            # DIRECT refs, deliberately: `plugin-marketplace#41` showed a skill reached
            # only through the closure publishes whatever tag a sibling happens to name,
            # and a DIRECT ref makes this list the authority (resolve.go preferEntity
            # step 2). Both are Go MODULES, so their tags follow the Go-module scheme
            # `v0.<YYYYDDD>.<HHMM with leading zeros stripped>` — not the superproject's
            # `v<YYYY.DDD.HHMM>`, which is not a valid Go module version. Each pin below
            # is the tag that repo's own merge minted.
            - '@github.com/opencharly/spec:v0.2026296.1338'
