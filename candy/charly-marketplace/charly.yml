            # layer-crabbox (family: tools) and plugin-crabbox (family: check, owner:
            # plugin-crabbox) — and the emitter's dedupe key is (Kind, Name) WITHOUT the
            # family, so they collide and preferEntity picks the higher CalVer tag. As of the
            # pins below that is layer-crabbox v2026.288.2114 over plugin-crabbox
            # v2026.288.1538, so tools/skills/crabbox is PRESENT (its frontmatter is the CLI
            # candy's) and check/skills/crabbox is ABSENT — the reverse of what this comment
            # said while layer-crabbox sat at v2026.274.0609. The `/charly-check:crabbox`
            # dispatcher row goes with the losing entity, because the `triggers:` that fed it
            # live on that side.
            # WHICH ONE IS PUBLISHED IS DECIDED BY TAG ORDER, which means a pin refresh can
            # swap one for the other — and this refresh did, silently, until a validator read
            # this comment against the diff. The collision itself is the defect:
            # opencharly/plugin-marketplace#20 keys resolve.go on (Kind, Name) without the
            # family. Fixing that belongs there, not here — no pin can express "prefer the
            # check-verb entity" without inventing a rule the emitter does not have.
