charly-marketplace:
    candy:
        version: 2026.239.1634
        description: |-
            The marketplace corpus SOURCE — the candy-dir charly.yml that makes
            `charly marketplace generate --root <this repo>` work post-cutover. It
            references pod-charly-hooks (the single `marketplace:` entity + the harness
            gate hooks) and every standalone candy repo that owns `skill:` / `hook:`
            entities, so readKinds' CollectEntitiesRemote resolves the full corpus
            transitively. The family dirs at this repo's root are the GENERATED corpus,
            not the source — regeneration is a no-op on a clean tree (the drift gate).
        candy:
            # charly's OWN candies are NOT referenced here: `marketplace generate`
            # reads them from --root <charly>. The repo-root entry that used to sit
            # here ('@github.com/opencharly/charly:vTAG') was not a candy node and
            # resolved to unknown candy "github.com/opencharly/charly" - silently in
            # this repo, but as a hard validation error in every consumer of the list.
            - '@github.com/opencharly/pod-charly-hooks:v2026.241.2134'
            # The candies extracted out of charly/candy/ by the de-submodule cutover's
            # Phase D (opencharly/charly#451). Before this, their skills reached the corpus
            # only through the --root charly checkout at the CI pin below.
            - '@github.com/opencharly/layer-charly-internals:v2026.245.0848'
