name: refresh

# Advances every @github pin in the refs list to its repo's newest tag IN THE PIN'S OWN
# SCHEME, regenerates the corpus, and opens a PR when anything moved.
#
# The scheme matters: a pin in this list is a Go-module version, and the two contract repos
# (`spec` and `sdk`) publish BOTH the Go-module scheme `v0.<YYYYDDD>.<HHMM>` and the
# superproject scheme `v<YYYY>.<DDD>.<HHMM>`. Resolving a pin to the newest tag of ANY
# scheme handed a Go-module pin a superproject tag — not a valid Go module version — and
# moved it BACKWARD in time while doing so (opencharly/marketplace#553). The resolver is
# `scripts/resolve_pin_tag.py`; the scheme it resolves in is the one the pin already
# carries, and no pin ever moves backward.
#
# WHY THIS EXISTS. candy/charly-marketplace/charly.yml is the ONE generation input since the
# candy de-submodule cutover, and every entry is a hand-written CalVer pin. Hand-written pins
# go stale silently: the corpus keeps building, the drift gate stays green, and the published
# skill is simply an old one. That is precisely the failure the cutover set out to remove —
# it came from a single stale charly pin, and a refs list of hand-maintained pins is the same
# failure with more surface. (No count: the list's size is the thing that drifts.)
#
# The content in these PRs is NOT unreviewed. Each pinned repo validated its own change
# through its own pr-validator before tagging; this workflow republishes what those repos
# already landed. What it removes is the human step of noticing that they did.
#
# Modelled on the umbrella's sync.yml (nightly gitlink bumps), with one difference: this one
# also REGENERATES, because a refs bump that does not carry its regenerated corpus would trip
# the deploy workflow's fail-closed drift gate on the very next run.

on:
  schedule:
    - cron: '41 4 * * *'   # daily 04:41 UTC — after the umbrella's 03:17 sync
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The FULL history, not a depth-1 clone: the consumer-currency report judges each
          # consumer's recorded pin with `git merge-base --is-ancestor`, and on a SHALLOW
          # history that test answers "not an ancestor" for a commit the clone simply does
          # not have — indistinguishable from a real divergence. This repo's whole history is
          # a few hundred commits and a few megabytes, so the honest checkout is the cheap one.
          fetch-depth: 0

      # The producer-side currency report. It runs on EVERY refresh, whether or not a pin
      # moved: a corpus landing that moved no refs still moved the corpus, and a consumer
      # whose pin is behind is an advance available NOW, in that consumer's own repo.
      #
      # It NEVER fails the run. A report that could fail the build would be a gate, and this
      # is not one: the remedy for a consumer that is behind is that consumer's pin-bump PR.
      - name: Report the recorded consumers' pin currency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash scripts/consumer-currency.sh | tee /tmp/consumer-currency.log
          {
            echo "## Consumer currency"
            echo
            echo "Each recorded consumer's recorded corpus pin, read over the public API and judged"
            echo "against this repo's merged main. REPORTED, never failed: a consumer that is behind"
            echo "is an advance available now, in that consumer's own repo."
            echo
            echo '```'
            cat /tmp/consumer-currency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Advance every pin to its repo's newest tag in the pin's own scheme
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/refresh-refs.sh | tee /tmp/refresh.log
          if git diff --quiet -- candy/charly-marketplace/charly.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a refresh PR is already open
        id: skip
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --search 'chore: refresh the refs list in:title' --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "a refresh PR is already open — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the pinned Charly toolchain
        id: charly
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        uses: ./.github/actions/build-charly
        with:
          build-calver: marketplace-refresh

      - name: Regenerate the corpus at the new pins
        # Same invocation and shared toolchain as deploy.yml: this project declares
        # the command, and its refs list is the generation input.
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        run: |
          # Captured so the PR body pastes the ACTUAL generation output, not a claim that
          # it ran. pipefail so a failing generator is not masked by tee's exit status.
          set -o pipefail
          "${{ steps.charly.outputs.binary }}" marketplace generate --root "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/generate.log

      # GITHUB_TOKEN cannot open a pull request: "Allow GitHub Actions to create and
      # approve pull requests" is off across this org, deliberately — the same switch also
      # lets a workflow APPROVE pull requests, which would let automation bypass review.
      #
      # The org already solves this class of problem for tag-on-merge (whose CHANGELOG
      # commit GITHUB_TOKEN cannot write to a protected main): mint a GitHub App token,
      # with a PAT fallback. Same pattern, same secrets.
      - name: Create bot token (GitHub App)
        id: bot-token-app
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.CHARLY_AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.CHARLY_AUTO_MERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Use PAT bot token
        id: bot-token-pat
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        run: echo "token=${{ secrets.CHARLY_BOT_TOKEN }}" >> "$GITHUB_OUTPUT"

      - name: Require bot token
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        env:
          APP_TOKEN: ${{ steps.bot-token-app.outputs.token }}
          PAT_TOKEN: ${{ steps.bot-token-pat.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ] && [ -z "$PAT_TOKEN" ]; then
            echo "::error::No bot token configured: set org secrets CHARLY_AUTO_MERGE_APP_ID + CHARLY_AUTO_MERGE_PRIVATE_KEY (GitHub App) or CHARLY_BOT_TOKEN (PAT)."
            exit 2
          fi

      - name: Open the refresh PR
        if: steps.bump.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token-app.outputs.token || steps.bot-token-pat.outputs.token }}
        run: |
          # `-uall` is LOAD-BEARING, both for the file list and the count. Plain
          # `git status --porcelain` collapses a brand-new directory to one `?? dir/`
          # line, so an ADDED generated file (a new skill entity under a new
          # directory) is neither named nor counted: the previous body reported
          # "2 SKILL.md changed" for a diff that carried THREE (one of them the
          # added tools/skills/crabbox/SKILL.md). `-uall` lists every untracked file.
          # `wc -l` counts them; grep -c exits 1 on zero matches, which under
          # `bash -e` would fail the step, so the zero case is normalised without
          # the `|| echo 0` double-print that previously corrupts the value.
          BUMPED=$(grep -cE '^  [a-z]' /tmp/refresh.log || true)
          BUMPED=${BUMPED:-0}
          # STAGE FIRST, THEN SNAPSHOT. The block below is published under the legend
          # "(`A` added, `D` removed, `M` modified)", so its codes must be the codes the
          # commit carries. The snapshot used to be taken ~200 lines BEFORE the run's
          # `git add -A`, so every file the run produced was still untracked at that
          # moment and read `??` — a code the legend does not define and the commit does
          # not carry. The COUNTS were right — `ADDED` accepted `^??` as well as `^A ` —
          # which is the worst combination: the report looked precise while describing
          # something the PR was not. Staging first makes the report's codes the commit's
          # codes by construction, and `ADDED` below counts the commit's additions only.
          #
          # ONE staging command, here. Nothing between this snapshot and the commit
          # touches the worktree (the body is assembled into /tmp/pr-body.md), so the
          # commit is byte-identical to what the late `git add -A` produced.
          git add -A
          STATUS=$(git status --porcelain -uall)
          SKILLS=$(printf '%s\n' "$STATUS" | grep -c 'SKILL.md' || true)
          SKILLS=${SKILLS:-0}
          FILES=$(printf '%s\n' "$STATUS" | grep -c . || true)
          FILES=${FILES:-0}
          # Accurate change characterization (A1/T3): a refs bump can ADD or REMOVE a
          # generated skill entity (the owning repo changed its own candy manifest), so
          # "the same skills at newer tags" is a false claim whenever a path is not a
          # pure modification. Derive the real class from the porcelain status codes.
          #
          # `ADDED` counts the INDEX column's `A` and nothing else. `^??` used to be
          # accepted here, and that clause is what made the counts agree with a
          # PRE-STAGING tree: an untracked file was counted as "added" even though the
          # commit did not carry it. The snapshot is taken after the staging now, so `??`
          # cannot appear in $STATUS at all, and an untracked file is by definition not an
          # addition to the commit — counting it would only ever be a way to be wrong.
          ADDED=$(printf '%s\n' "$STATUS" | grep -c '^A ' || true)
          REMOVED=$(printf '%s\n' "$STATUS" | grep -c '^ D\|^D ' || true)
          MODIFIED=$(printf '%s\n' "$STATUS" | grep -c '^ M\|^M ' || true)

          # THE ELISION — one implementation, in scripts/refresh-elide.sh, and it is TESTED
          # (scripts/refresh_elide_test.sh). It is NOT inlined here, because the generator's
          # routine per-ref progress has TWO shapes, emitted by two different modules
          # (opencharly/spec refs/git.go and opencharly/sdk candywalk/candywalk.go), and the
          # elision #413 added covered only ONE of them: five daily runs (2026-10-24 …
          # 2026-10-28) then assembled a 117 KB body and were rejected by GitHub, and the
          # published corpus was frozen for five days. opencharly/marketplace#413, #451.
          #
          # The script writes the elided block and the notice; both are pasted verbatim
          # into the body below. It exits non-zero when the capture is missing or empty,
          # so the run fails loud here rather than publishing a body that claims evidence
          # it does not have.
          bash scripts/refresh-elide.sh /tmp/generate.log /tmp/elide-block.txt /tmp/elide-notice.txt

          {
            echo "## Summary of changes"
            echo
            echo "Automated refresh: every \`@github\` pin in \`candy/charly-marketplace/charly.yml\`"
            echo "advanced to its repo's newest tag IN THE PIN'S OWN SCHEME, with the regenerated corpus in the same commit."
            echo
            echo "- **${BUMPED}** pin(s) advanced"
            echo "- **${FILES}** file(s) total (added ${ADDED}, removed ${REMOVED}, modified ${MODIFIED})"
            echo "- **${SKILLS}** \`SKILL.md\` changed"
            echo
            echo "Every changed file, with its status (\`A\` added, \`D\` removed, \`M\` modified):"
            echo
            echo '```'
            printf '%s\n' "$STATUS"
            echo '```'
            echo
            echo "Everything outside \`candy/charly-marketplace/charly.yml\` is **regenerated output**, not an"
            echo "authored edit. A changed \`SKILL.md\` or reference doc means the OWNING repo changed that text"
            echo "in its own candy manifest and tagged it; \`charly marketplace generate\` then reproduces it here"
            echo "byte for byte. This PR PROPAGATES that content — it does not author it, and it cannot review"
            echo "it, because the owning repo's own \`pr-validator\` gated it before the tag existed. If such a"
            echo "file needs changing, the change belongs in the owning repo, not here: an edit made here is"
            echo "overwritten by the next generate."
            echo
            echo "The refs list is the ONE generation input, and every entry is a CalVer pin. Hand-maintained"
            echo "pins go stale silently — the corpus keeps building, the drift gate stays green, and the"
            echo "published skill is simply an old one. That is the failure the candy de-submodule cutover"
            echo "removed for a single charly pin; this workflow removes it for the rest of them."
            echo
            echo "The content is not unreviewed: each pinned repo validated its own change through its own"
            echo "\`pr-validator\` before tagging. This republishes what those repos already landed."
            echo
            echo "<details><summary>pins advanced</summary>"
            echo
            echo '```'
            sed -n '/->/p' /tmp/refresh.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "## Consumer currency"
            echo
            echo "Each recorded consumer's recorded corpus pin, read over the public API and judged"
            echo "against this repo's merged main. REPORTED, never failed: a consumer that is behind"
            echo "is an advance available now, in that consumer's own repo."
            echo
            echo '```'
            cat /tmp/consumer-currency.log
            echo '```'
            echo
            echo "## Change class"
            echo
            echo "**cross-repo (consumer leg)** — refs-list pins plus the corpus they generate. No workflow,"
            echo "no script, no Go."
            echo
            echo "**Breaking change + rollback:** the published corpus is a projection of the refs list, so"
            echo "this refresh carries whatever the owning repos tagged — including any skill ENTITY added or"
            echo "removed by a pin that changed its own candy manifest (the file list above names each, with"
            echo "\`A\`/\`D\`/modified status). Where a pin is a pure tag advance of unchanged content, the"
            echo "projection is byte-identical; where the owning repo changed a manifest, the projection"
            echo "changes with it. Rollback is a plain revert of this PR."
            echo
            echo "## How R10-tested — exact gate, commands, and pasted output"
            echo
            echo "- **The gate:** this repo's \`marketplace\` workflow, whose drift gate fails closed if the"
            echo "  committed corpus does not match the refs list. It runs on this PR."
            echo "- **Eval beds run:** \`N/A (pin refresh)\`."
            echo "- **Fresh rebuild:** the binary was built from the pinned charly checkout in this run."
            echo "- **Did the CHANGED code path execute live?** **Yes** — generation ran at the new pins and"
            echo "  resolved every advanced ref over the network."
            echo
            echo '*1. Gate output — the refs resolution this run performed:*'
            echo '```'
            sed -n '/->/p' /tmp/refresh.log
            echo '```'
            echo
            echo '*2. Each changed code path executing — the ACTUAL generator output, minus the two'
            echo '   declared classes of routine lines (each counted in the notice below):*'
            echo '```'
            # The elided block is produced by scripts/refresh-elide.sh — ONE implementation,
            # TESTED by scripts/refresh_elide_test.sh. The classes it declares are stated in
            # the notice pasted verbatim below this fence, with each class's line count and
            # byte count, so what this body does not show is MEASURED rather than assumed.
            #
            # WHY there are TWO classes and not one: the generator writes a routine per-ref
            # progress line from TWO modules — `Downloading <ref>…` (opencharly/spec,
            # refs/git.go) and `charly: resolving <ref> (N resolved, M queued)`
            # (opencharly/sdk, candywalk/candywalk.go) — and #413's elision matched only the
            # first, so the second was pasted whole. Measured on the 2026-10-28 run's own
            # log (run 74): 179 835 bytes in, of which 160 742 bytes (1 780 lines) were the
            # two progress shapes and 19 006 bytes (496 lines) were the generator's
            # artifact-path list; 87 bytes survive — the toolchain line and the report line.
            # opencharly/marketplace#413, #451.
            #
            # Every warning and every error is pasted VERBATIM: a warning is what this
            # section exists to surface, so nothing is elided that is not a declared class.
            cat /tmp/elide-block.txt
            echo "\$ git status --porcelain -uall | wc -l"
            echo "${FILES}"
            echo '```'
            cat /tmp/elide-notice.txt
            echo
            echo '*3. Docs-only evidence:*'
            echo '```'
            echo "N/A — pins plus regenerated artifacts."
            echo '```'
            echo
            echo "**The drift gate.** This repo's \`marketplace\` workflow (\`deploy.yml\`) regenerates and"
            echo "FAILS CLOSED if the committed corpus does not match the refs list. Its gate step, from"
            echo "\`.github/workflows/deploy.yml\` in this repo:"
            echo
            echo '```'
            # FAIL LOUD: a `sed -n '/A/,/B/p'` emits NOTHING when the anchors do not match, so a
            # reworded anchor in deploy.yml would silently emit an EMPTY fence under prose that
            # still asserts the gate fails closed — evidence loss with no signal. Capture it and
            # refuse to emit an empty block.
            GATE_STEP=$(sed -n '/# git diff --exit-code alone is NOT fail-closed/,/^          echo "corpus: committed tree/p' .github/workflows/deploy.yml)
            if [ -z "$GATE_STEP" ]; then
              echo "(ERROR: could not extract the drift-gate step from deploy.yml — anchors moved)" >&2
              GATE_STEP="(extraction failed: the deploy.yml gate anchors moved; fix refresh.yml)"
            fi
            printf '%s\n' "$GATE_STEP"
            echo '```'
            echo
            echo "## Attribution tier"
            echo
            echo "**fully tested and validated** — regeneration ran in CI at the new pins (output pasted"
            echo "above) and the repo's fail-closed drift gate re-runs on this PR."
            echo
            echo "## Harness rulebook compliance"
            echo
            echo "- **R0 skills:** the owning skill for generation is \`/charly-internals:marketplace\`; the"
            echo "  refs list is the ONE input and is edited only by the resolver, never by hand."
            echo "- **R1 RCA + zero warnings:** the refresh script resolves each pin WITHIN ITS OWN SCHEME and reports every"
            echo "  repo it could not resolve. Its summary line for this run:"
            echo
            echo '```'
            # Derive from the resolver's OWN summary line ('refresh-refs: N pin(s) advanced,
            # M unresolved'), not a guessed token: fail loud if the line is absent or M > 0.
            SUMMARY=$(grep -E 'refresh-refs: [0-9]+ pin\(s\) advanced, [0-9]+ unresolved' /tmp/refresh.log | tail -1)
            if [ -z "$SUMMARY" ]; then
              echo "(ERROR: no 'refresh-refs: … unresolved' summary line in /tmp/refresh.log)"
            else
              printf '%s\n' "$SUMMARY"
              UNRES=$(printf '%s' "$SUMMARY" | grep -oE '[0-9]+ unresolved' | grep -oE '^[0-9]+')
              [ "${UNRES:-1}" -eq 0 ] || grep 'UNRESOLVED' /tmp/refresh.log
            fi
            echo '```'
            echo "- **R1 no parking:** an edit to the corpus here is overwritten by the next generate, so a"
            echo "  content change belongs in the OWNING repo (which gated it via its own pr-validator"
            echo "  before tagging); a defect in THIS workflow is fixed here."
            echo "- **R2 no duplication:** one refs list, one owner; the generator is the single corpus"
            echo "  implementation."
            echo "- **R3 no workaround:** every new pin is a MERGED tag in the SCHEME the pin already carries — no"
            echo "  branch refs, no version-less refs. Tags are compared NUMERICALLY, not lexicographically, and a"
            echo "  pin never moves BACKWARD: a repo whose newest tag in the pin's scheme is older than the pin"
            echo "  leaves it alone and says so."
            echo "- **R5:** the pins are replaced, not appended to."
            echo "- **R6 git safety:** a fresh branch per run; no force-push; no push to \`main\`."
            echo "- **R7 emitted artifacts:** the corpus is regenerated by the tool, never hand-edited, and"
            echo "  the drift gate validates it at its boundary (\`N/A\` for a bed: the gate is the drift gate)."
            echo "- **R8 live, not faked:** every API call in this run is real; no mocked service stands in"
            echo "  for the GitHub boundary."
            echo "- **R9 binary == source:** \`N/A — this repo builds no binary\`; the pinned charly binary"
            echo "  is built from the CI-time tag in this run."
            echo "- **R10 disposable + coverage:** \`N/A — no deploy/bed\`; this is a refs-list pin refresh"
            echo "  plus its regenerated corpus, gated by the fail-closed drift gate (deploy.yml)."
            echo "- **RDD / ADE / SDD:** RDD — the pins are resolved from the owning repos' MERGED tags"
            echo "  (the resolver reads each repo's newest CalVer), not asserted. ADE — no candy. SDD —"
            echo "  \`N/A\`, no CUE/schema/generated-code change."
            echo "- **Hard cutover:** one atomic commit; the refs are replaced, not appended to."
            echo
            echo "---"
            echo
            echo "## Attribution"
            echo
            echo "This body is emitted by the fixed, model-free \`git status --porcelain -uall\` +"
            echo "\`printf/echo\` block in \`.github/workflows/refresh.yml\` (visible in this workflow's"
            echo "committed source), with the generator's log elided by \`scripts/refresh-elide.sh\`"
            echo "(visible in this repo's committed source, and covered by \`scripts/refresh_elide_test.sh\`)."
            echo "The runtime identity is the GitHub Actions runner itself."
            echo
            echo "*Assisted-by: GitHub Actions ubuntu-latest (fully tested and validated)*"
          } > /tmp/pr-body.md

          # GitHub rejects a PR body over 65536 BYTES ("GraphQL: Body is too long") and that
          # rejection is DETERMINISTIC — nothing below can fix it, and leaving it to GitHub
          # means reading an opaque error to learn that the body is too long.
          #
          # The size gate runs BEFORE the commit and the push, in full: the assembled body
          # is measured, the measurement is broken down, and the run FAILS HERE if the body
          # is over the cap. This is this issue's own root-fix line — "pre-push
          # complete-body validation/size gate" — and the order is not incidental.
          # opencharly/marketplace#451.
          #
          # Nothing is lost when it fires. The next run re-resolves every pin to its repo's
          # newest tag IN THE PIN'S OWN SCHEME and regenerates the corpus from that refs
          # list, so an advance is DEFERRED to the next run, never dropped — and what this
          # gate must never do is publish a body GitHub will refuse.
          #
          # The measurement is also the DIAGNOSIS. The old message blamed the elided
          # `Downloading …` progress lines — the one shape that WAS being elided — so it
          # pointed the reader at the wrong thing for five consecutive days. The message
          # now names the byte count of the pasted generator block and of everything else,
          # so the section that actually grew is obvious from the error alone.
          PR_BODY_BYTES=$(wc -c < /tmp/pr-body.md)
          ELIDE_BLOCK_BYTES=$(wc -c < /tmp/elide-block.txt)
          OTHER_BYTES=$((PR_BODY_BYTES - ELIDE_BLOCK_BYTES))

          if [ "$PR_BODY_BYTES" -gt 65536 ]; then
            echo "::error title=refresh: the assembled PR body is over GitHub's limit::${PR_BODY_BYTES} bytes; the limit is 65536."
            echo "Of those, the pasted generator block is ${ELIDE_BLOCK_BYTES} bytes and every other"
            echo "section together is ${OTHER_BYTES} bytes. The two routine classes (the per-ref"
            echo "progress lines and the generator's artifact-path list) are ALREADY elided by"
            echo "scripts/refresh-elide.sh, so the section that grew is the one the elision notice"
            echo "does not account for — read the notice in the body for the counts."
            echo "Nothing is lost: nothing was committed and nothing was pushed. The next run"
            echo "re-resolves every pin to its repo's newest tag and regenerates the corpus from"
            echo "that refs list, so the advance is deferred to the next run, not dropped."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "refresh/$(date -u +%Y%m%d-%H%M%S)"
          git commit -m "chore: refresh the refs list to the newest tags"
          git push -u origin HEAD

          # The branch is pushed FIRST and the PR attempted second, so a failure here costs
          # a PR rather than a night's refresh — the work is already safe on a branch.
          #
          # ONE attempt, then an idempotent READBACK. There is no retry loop: a repeat of
          # a WRITE cannot make it safe, because a 504 can mean the PR was created and only
          # the response was lost — the repeat then fails with "already exists" and masks
          # the success. The readback below is what tells the three states apart.
          BR=$(git rev-parse --abbrev-ref HEAD)
          attempt_log="$(gh pr create --title "chore: refresh the refs list" --body-file /tmp/pr-body.md 2>&1)" && attempt_rc=0 || attempt_rc=$?
          # The readback is the discriminator: "created", "created but the response was lost", and
          # "not created" are three different states, and only the API can tell them apart.
          pr_num="$(gh pr list --head "$BR" --state open --json number --jq '.[].number' 2>/dev/null || true)"
          if [ -n "$pr_num" ]; then
            if [ "$attempt_rc" -eq 0 ]; then
              echo "published: PR #$pr_num"
            else
              echo "the attempt reported an error (rc=$attempt_rc) but the PR EXISTS (#$pr_num) —"
              echo "the write landed and only the response was lost:"
              printf '%s\n' "$attempt_log"
            fi
          else
            echo "::error title=refresh: the publication attempt did not create a PR::rc=$attempt_rc"
            printf '%s\n' "$attempt_log"
            echo "The refreshed branch IS pushed and nothing is lost: $BR"
            echo "Open it by hand:  https://github.com/${GITHUB_REPOSITORY}/pull/new/$BR"
            echo "If the error was a permission one rather than a 5xx, check the"
            echo "CHARLY_AUTO_MERGE_APP_ID / _PRIVATE_KEY org secrets and that the app is"
            echo "installed on this repository. Do NOT 'fix' it by enabling"
            echo "can_approve_pull_request_reviews — that also lets workflows approve PRs."
            exit 1
          fi
